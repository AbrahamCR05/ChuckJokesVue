<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chuck Norris Cards — Homework 10</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      background: #111010;
      color: #f0ece6;
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      min-height: 100vh;
    }

    /* ── HEADER ── */
    .site-header {
      background: #c0392b;
      padding: 2.5rem 1rem 2rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .site-header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        45deg, transparent, transparent 10px,
        rgba(0,0,0,.08) 10px, rgba(0,0,0,.08) 20px
      );
    }
    .site-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.2rem, 5vw, 4rem);
      letter-spacing: .06em;
      color: #fff;
      position: relative;
      text-shadow: 3px 3px 0 rgba(0,0,0,.3);
    }
    .site-header p {
      color: rgba(255,255,255,.75);
      font-size: .88rem;
      margin-top: .4rem;
      position: relative;
    }

    /* ── CARDS ── */
    .chuck-card {
      background: #1c1b1b;
      border: 1px solid #2e2c2c;
      border-top: 3px solid #c0392b;
      border-radius: 10px;
      overflow: hidden;
      height: 100%;
      transition: transform .2s, box-shadow .2s;
    }
    .chuck-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 28px rgba(192,57,43,.2);
    }

    .chuck-card .card-img-wrap {
      background: #161515;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      border-bottom: 1px solid #2e2c2c;
    }
    .chuck-card img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 3px solid #c0392b;
      object-fit: cover;
    }

    .chuck-card .card-body {
      padding: 1.2rem;
    }
    .chuck-card .card-number {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1rem;
      color: #c0392b;
      letter-spacing: .1em;
      margin-bottom: .4rem;
    }
    .chuck-card .card-text {
      font-size: .88rem;
      line-height: 1.7;
      color: #c8c3bc;
    }

    /* ── FOOTER ── */
    .site-footer {
      text-align: center;
      padding: 2rem;
      font-size: .78rem;
      color: #6b6560;
      border-top: 1px solid #2e2c2c;
      margin-top: 3rem;
    }
    .site-footer strong { color: #c0392b; }
  </style>
</head>
<body>

<!-- Header -->
<div class="site-header">
  <h1>⚡ Chuck Norris Facts</h1>
  <p>Homework 10 — Vue Component with Props + Bootstrap Grid</p>
</div>

<!-- Vue App -->
<div id="app" class="container py-5">
  <div class="row g-4">
    <!--
      3 cards per row on md+ screens  → col-md-4
      1 card per row on small screens → col-12 (default)
    -->
    <div
      v-for="(joke, index) in chuck"
      :key="index"
      class="col-12 col-md-4"
    >
      <chuck-card
        :icon_url="joke.icon_url"
        :value="joke.value"
        :number="index + 1"
      ></chuck-card>
    </div>
  </div>
</div>

<!-- Footer (outside #app so {{ }} isn't needed) -->
<footer class="site-footer">
  &copy; 2026 &nbsp;|&nbsp;
  <strong>Abraham Cuadras</strong> &nbsp;|&nbsp;
  Desarrollo Web III &nbsp;|&nbsp; Homework 10
</footer>

<!-- Vue 2 CDN -->
<script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>

<script>
  // ── Chuck Card Component ──────────────────────────────────────────
  Vue.component('chuck-card', {
    props: ['icon_url', 'value', 'number'],
    template: `
      <div class="chuck-card">
        <div class="card-img-wrap">
          <img :src="icon_url" alt="Chuck Norris avatar">
        </div>
        <div class="card-body">
          <div class="card-number">Fact #{{ number }}</div>
          <p class="card-text">{{ value }}</p>
        </div>
      </div>
    `
  })

  // ── Vue Instance ─────────────────────────────────────────────────
  new Vue({
    el: '#app',
    data() {
      return {
        chuck: [
          {
            icon_url: "https://assets.chucknorris.host/img/avatar/chuck-norris.png",
            value: "Chuck Norris can skydive into outer space."
          },
          {
            icon_url: "https://assets.chucknorris.host/img/avatar/chuck-norris.png",
            value: "The chief export of Chuck Norris is pain."
          },
          {
            icon_url: "https://assets.chucknorris.host/img/avatar/chuck-norris.png",
            value: "Chuck Norris doesn't read books. He stares them down until he gets the information he wants."
          },
          {
            icon_url: "https://assets.chucknorris.host/img/avatar/chuck-norris.png",
            value: "Time waits for no man. Unless that man is Chuck Norris."
          },
          {
            icon_url: "https://assets.chucknorris.host/img/avatar/chuck-norris.png",
            value: "If you spell Chuck Norris in Scrabble, you win. Forever."
          },
        ]
      }
    }
  })
</script>

</body>
</html>
